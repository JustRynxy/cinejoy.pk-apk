      - name: 2. Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 4. APK Derle
        run: gradle assembleDebug --max-workers=2

      - name: 5. APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-NextBox-v50
          path: app/build/outputs/apk/debug/app-debug.apk
