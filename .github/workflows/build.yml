name: APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Proje Klasorlerini veYuksek Cozunurluklu Logolari Olustur
        run: |
          mkdir -p app/src/main/java/com/cinejoy/pro
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          python3 -m pip install --break-system-packages Pillow || python3 -m pip install Pillow
          cat << 'EOF' > generate_assets.py
          from PIL import Image, ImageDraw

          def draw_clapper(draw, size):
              # Klaket Alt Gövde (Beyaz)
              bx1, by1, bx2, by2 = int(size*0.23), int(size*0.40), int(size*0.77), int(size*0.77)
              draw.rounded_rectangle([bx1, by1, bx2, by2], radius=int(size*0.06), fill=(250, 250, 255, 255))
              # Klaket Üst Şerit (Sinema Kırmızısı)
              tx1, ty1, tx2, ty2 = int(size*0.23), int(size*0.24), int(size*0.77), int(size*0.36)
              draw.rounded_rectangle([tx1, ty1, tx2, ty2], radius=int(size*0.04), fill=(229, 9, 20, 255))
              # Klaket Beyaz Diyagonal Şeritler
              for offset in [0.28, 0.42, 0.56, 0.70]:
                  x = int(size * offset)
                  w = int(size * 0.045)
                  draw.polygon([(x, ty1), (x+w, ty1), (x, ty2), (x-w, ty2)], fill=(250, 250, 255, 255))
              # Play Üçgeni
              px1, py1 = int(size*0.43), int(size*0.47)
              px2, py2 = int(size*0.43), int(size*0.69)
              px3, py3 = int(size*0.62), int(size*0.58)
              draw.polygon([(px1, py1), (px2, py2), (px3, py3)], fill=(14, 14, 20, 255))

          def create_icon(size, path, is_round=False):
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              if is_round:
                  draw.ellipse([0, 0, size-1, size-1], fill=(14, 14, 20, 255))
                  draw.ellipse([int(size*0.03), int(size*0.03), int(size*0.97), int(size*0.97)], outline=(229, 9, 20, 255), width=max(2, int(size*0.035)))
              else:
                  r = int(size * 0.22)
                  draw.rounded_rectangle([0, 0, size-1, size-1], radius=r, fill=(14, 14, 20, 255))
                  draw.rounded_rectangle([int(size*0.03), int(size*0.03), int(size*0.97), int(size*0.97)], radius=int(r*0.88), outline=(229, 9, 20, 255), width=max(2, int(size*0.035)))
              draw_clapper(draw, size)
              img.save(path, 'PNG')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          for folder, s in sizes.items():
              create_icon(s, f'app/src/main/res/{folder}/ic_launcher.png', False)
              create_icon(s, f'app/src/main/res/{folder}/ic_launcher_round.png', True)

          # Adaptive Icon Ön Planı (432x432)
          fg = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          fg_draw = ImageDraw.Draw(fg)
          draw_clapper(fg_draw, 432)
          fg.save('app/src/main/res/drawable/ic_launcher_fg.png', 'PNG')

          # Android TV Ana Ekran Banner'ı (320x180)
          banner = Image.new('RGBA', (320, 180), (14, 14, 20, 255))
          bdraw = ImageDraw.Draw(banner)
          bdraw.rounded_rectangle([4, 4, 316, 176], radius=20, outline=(229, 9, 20, 180), width=3)
          # Banner Sol İkon
          bdraw.rounded_rectangle([42, 66, 114, 132], radius=8, fill=(250, 250, 255, 255))
          bdraw.rounded_rectangle([42, 42, 114, 60], radius=5, fill=(229, 9, 20, 255))
          bdraw.polygon([(70, 80), (70, 118), (98, 99)], fill=(14, 14, 20, 255))
          # Banner Sağ Tasarım
          bdraw.rounded_rectangle([138, 66, 276, 88], radius=6, fill=(250, 250, 255, 245))
          bdraw.rounded_rectangle([138, 100, 228, 116], radius=5, fill=(229, 9, 20, 240))
          banner.save('app/src/main/res/drawable/tv_banner.png', 'PNG')
          EOF
          python3 generate_assets.py

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0E0E14" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "CinejoyPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cinejoy.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cinejoy.pro"
                  minSdk 21
                  targetSdk 34
                  versionCode 12
                  versionName "6.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:label="Cinejoy"
                  android:usesCleartextTraffic="true"
                  android:banner="@drawable/tv_banner"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/cinejoy/pro/MainActivity.java
          package com.cinejoy.pro;

          import android.app.Activity;
          import android.app.Dialog;
          import android.app.UiModeManager;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;
              private ProgressBar loadingBar;
              private final String TARGET_URL = "https://cinejoy.pk";
              private SharedPreferences prefs;
              private boolean isTelevision = false;

              private final String[] LANG_NAMES = {
                  "🇹🇷   Türkçe  (Altyazı & Dublaj)",
                  "🇬🇧   English  (Original & Subtitles)",
                  "🇩🇪   Deutsch  (German)",
                  "🇪🇸   Español  (Spanish)",
                  "🇫🇷   Français  (French)"
              };
              private final String[] LANG_CODES = {"tr", "en", "de", "es", "fr"};
              private final String[] LANG_LABELS = {"Turkish", "English", "German", "Spanish", "French"};
              private final String[] LANG_KEYWORDS = {
                  "türkçe,turkce,turkish,tur,tr,dublaj,altyazı,altyazi",
                  "english,eng,en",
                  "deutsch,german,deu,ger,de",
                  "español,espanol,spanish,esp,es",
                  "français,francais,french,fre,fr"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("CinejoyProPrefs", MODE_PRIVATE);

                  UiModeManager uiModeManager = (UiModeManager) getSystemService(UI_MODE_SERVICE);
                  isTelevision = (uiModeManager != null && uiModeManager.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION);

                  if (isTelevision) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                  }

                  FrameLayout rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#0B0B0F"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0B0B0F"));

                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  fullscreenContainer.setVisibility(View.GONE);

                  loadingBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  loadingBar.setMax(100);
                  loadingBar.setProgressDrawable(new ColorDrawable(Color.parseColor("#E50914")));
                  FrameLayout.LayoutParams barLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 6);
                  barLp.gravity = Gravity.TOP;

                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(loadingBar, barLp);

                  setContentView(rootLayout);
                  setupWebView();

                  loadSiteWithLanguage();
                  if (!prefs.contains("selected_lang_index")) {
                      showCinematicLanguageModal(true);
                  }
              }

              public class WebAppBridge {
                  @JavascriptInterface
                  public void setVideoPlaying(boolean playing) {
                      runOnUiThread(() -> {
                          if (!isTelevision) {
                              if (playing) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                              } else if (customView == null) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openLanguageSettings() {
                      runOnUiThread(() -> showCinematicLanguageModal(false));
                  }
              }

              private void showCinematicLanguageModal(boolean isFirstLaunch) {
                  Dialog dialog = new Dialog(this);
                  dialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  dialog.setCancelable(!isFirstLaunch);
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      dialog.getWindow().setDimAmount(0.82f);
                  }

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(68, 56, 68, 56);
                  GradientDrawable cardBg = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.parseColor("#1A1A26"), Color.parseColor("#101018")});
                  cardBg.setCornerRadius(42f);
                  cardBg.setStroke(2, Color.parseColor("#383850"));
                  card.setBackground(cardBg);

                  TextView badge = new TextView(this);
                  badge.setText("CINEJOY SMART ENGINE");
                  badge.setTextColor(Color.parseColor("#E50914"));
                  badge.setTextSize(11f);
                  badge.setTypeface(null, Typeface.BOLD);
                  badge.setLetterSpacing(0.15f);
                  badge.setGravity(Gravity.CENTER);
                  card.addView(badge);

                  TextView title = new TextView(this);
                  title.setText("İçerik ve Altyazı Dili");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(23f);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 8, 0, 8);
                  card.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("Filmlerde tercih ettiğiniz altyazı ve ses dili otomatik seçilir.\nKumandadan Menü tuşuna basarak istediğiniz an değiştirebilirsiniz.");
                  sub.setTextColor(Color.parseColor("#9898B0"));
                  sub.setTextSize(13f);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, 0, 0, 36);
                  card.addView(sub);

                  int currentIdx = prefs.getInt("selected_lang_index", 0);

                  for (int i = 0; i < LANG_NAMES.length; i++) {
                      final int index = i;
                      Button btn = new Button(this);
                      btn.setText(LANG_NAMES[i]);
                      btn.setTextColor(Color.WHITE);
                      btn.setTextSize(15.5f);
                      btn.setTypeface(null, i == currentIdx ? Typeface.BOLD : Typeface.NORMAL);
                      btn.setAllCaps(false);
                      btn.setGravity(Gravity.CENTER_VERTICAL | Gravity.START);
                      btn.setPadding(48, 28, 48, 28);

                      GradientDrawable normalBg = new GradientDrawable();
                      normalBg.setColor(i == currentIdx ? Color.parseColor("#262638") : Color.parseColor("#191924"));
                      normalBg.setCornerRadius(24f);
                      normalBg.setStroke(2, i == currentIdx ? Color.parseColor("#606080") : Color.parseColor("#252536"));

                      GradientDrawable focusedBg = new GradientDrawable(
                              GradientDrawable.Orientation.LEFT_RIGHT,
                              new int[]{Color.parseColor("#E50914"), Color.parseColor("#B80710")});
                      focusedBg.setCornerRadius(24f);
                      focusedBg.setStroke(3, Color.WHITE);

                      StateListDrawable states = new StateListDrawable();
                      states.addState(new int[]{android.R.attr.state_focused}, focusedBg);
                      states.addState(new int[]{android.R.attr.state_pressed}, focusedBg);
                      states.addState(new int[]{}, normalBg);
                      btn.setBackground(states);

                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              isTelevision ? 780 : ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, 10, 0, 10);
                      btn.setLayoutParams(lp);

                      btn.setOnFocusChangeListener((v, hasFocus) -> {
                          v.animate()
                              .scaleX(hasFocus ? 1.035f : 1.0f)
                              .scaleY(hasFocus ? 1.035f : 1.0f)
                              .setDuration(150)
                              .start();
                      });

                      btn.setOnClickListener(v -> {
                          prefs.edit().putInt("selected_lang_index", index).apply();
                          Toast.makeText(MainActivity.this, LANG_NAMES[index] + " kaydedildi", Toast.LENGTH_SHORT).show();
                          dialog.dismiss();
                          injectSmartEngine();
                      });

                      card.addView(btn);
                      if (i == currentIdx) {
                          btn.post(btn::requestFocus);
                      }
                  }

                  ScrollView scroll = new ScrollView(this);
                  scroll.setVerticalScrollBarEnabled(false);
                  scroll.addView(card);
                  dialog.setContentView(scroll);
                  dialog.show();
              }

              private void loadSiteWithLanguage() {
                  int idx = prefs.getInt("selected_lang_index", 0);
                  String code = LANG_CODES[idx];
                  Map<String, String> headers = new HashMap<>();
                  headers.put("Accept-Language", code + "-" + code.toUpperCase() + "," + code + ";q=0.9,en-US;q=0.8,en;q=0.7");
                  webView.loadUrl(TARGET_URL, headers);
              }

              // Ultra Hafif, Sıfır Kasma Yapan Apple TV Tarzı Odaklanma ve Oynatıcı Motoru
              private void injectSmartEngine() {
                  int idx = prefs.getInt("selected_lang_index", 0);
                  String langCode = LANG_CODES[idx];
                  String langLabel = LANG_LABELS[idx];
                  String keywords = LANG_KEYWORDS[idx];

                  String js = "javascript:(function() {" +
                          "window.__cjLangCode = '" + langCode + "';" +
                          "window.__cjLangLabel = '" + langLabel + "';" +
                          "window.__cjKeywords = '" + keywords + "'.split(',');" +
                          "try {" +
                          "   localStorage.setItem('language', window.__cjLangCode);" +
                          "   localStorage.setItem('lang', window.__cjLangCode);" +
                          "   localStorage.setItem('pl_lang', window.__cjLangCode);" +
                          "   localStorage.setItem('subtitle_language', window.__cjLangLabel);" +
                          "   localStorage.setItem('captions_language', window.__cjLangLabel);" +
                          "   localStorage.setItem('jwplayer.captionLabel', window.__cjLangLabel);" +
                          "   localStorage.setItem('plyr', JSON.stringify({language: window.__cjLangCode, captions: {active: true}}));" +
                          "} catch(e){}" +
                          "if (!document.getElementById('cinejoy_pro_css')) {" +
                          "   var style = document.createElement('style');" +
                          "   style.id = 'cinejoy_pro_css';" +
                          "   style.innerHTML = '" +
                          "       * { -webkit-tap-highlight-color: transparent; } " +
                          "       *:focus { outline: none !important; } " +
                          "       a:focus, button:focus, input:focus, select:focus, [role=\"button\"]:focus, [tabindex=\"0\"]:focus { " +
                          "           outline: 2.5px solid #FFFFFF !important; " +
                          "           outline-offset: 3px !important; " +
                          "           box-shadow: 0 0 0 5px rgba(229, 9, 20, 0.55), 0 12px 24px rgba(0, 0, 0, 0.65) !important; " +
                          "           transform: scale(1.045) !important; " +
                          "           will-change: transform !important; " +
                          "           transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), outline 0.12s ease !important; " +
                          "           border-radius: 8px !important; " +
                          "           z-index: 99 !important; " +
                          "       } " +
                          "   ';" +
                          "   (document.head || document.documentElement).appendChild(style);" +
                          "}" +
                          "function dismissInitialSiteBannerOnce() {" +
                          "   if (window.__cjBannerDismissed) return;" +
                          "   var path = window.location.pathname.toLowerCase();" +
                          "   if (path.indexOf('/watch') !== -1 || path.indexOf('/play') !== -1 || document.querySelector('video')) return;" +
                          "   var swalBtn = document.querySelector('.swal2-close, .swal2-confirm, .fc-cta-consent');" +
                          "   if (swalBtn && swalBtn.offsetParent !== null) {" +
                          "       window.__cjBannerDismissed = true;" +
                          "       try { swalBtn.click(); } catch(e){}" +
                          "   }" +
                          "}" +
                          "setTimeout(dismissInitialSiteBannerOnce, 900);" +
                          "setTimeout(dismissInitialSiteBannerOnce, 2200);" +
                          "function refreshFocusableElements() {" +
                          "   var nodes = document.querySelectorAll('a, button, [role=\"button\"], [onclick], [class*=\"card\"], [class*=\"poster\"], [class*=\"movie-item\"]');" +
                          "   for (var i = 0; i < nodes.length; i++) {" +
                          "       var el = nodes[i];" +
                          "       if (!el.hasAttribute('tabindex') && el.offsetWidth > 20 && el.offsetHeight > 20) {" +
                          "           el.setAttribute('tabindex', '0');" +
                          "       }" +
                          "   }" +
                          "}" +
                          "refreshFocusableElements();" +
                          "function activatePreferredTracks() {" +
                          "   var kw = window.__cjKeywords || [];" +
                          "   var lc = window.__cjLangCode || 'tr';" +
                          "   var videos = document.querySelectorAll('video');" +
                          "   for (var vIdx = 0; vIdx < videos.length; vIdx++) {" +
                          "       var v = videos[vIdx];" +
                          "       if (v.textTracks) {" +
                          "           for (var i = 0; i < v.textTracks.length; i++) {" +
                          "               var t = v.textTracks[i];" +
                          "               var lbl = (t.label || '').toLowerCase();" +
                          "               var slng = (t.language || '').toLowerCase();" +
                          "               if (slng.indexOf(lc) === 0 || kw.some(function(k){ return lbl.indexOf(k) !== -1; })) {" +
                          "                   t.mode = 'showing';" +
                          "               }" +
                          "           }" +
                          "       }" +
                          "   }" +
                          "   if (window.jwplayer) {" +
                          "       try {" +
                          "           var jw = window.jwplayer();" +
                          "           if (jw && jw.getCaptionsList) {" +
                          "               var list = jw.getCaptionsList();" +
                          "               for (var c = 0; c < list.length; c++) {" +
                          "                   var clbl = (list[c].label || '').toLowerCase();" +
                          "                   if (kw.some(function(k){ return clbl.indexOf(k) !== -1; })) { jw.setCurrentCaptions(c); break; }" +
                          "               }" +
                          "           }" +
                          "           if (jw && jw.getAudioTracks) {" +
                          "               var alist = jw.getAudioTracks();" +
                          "               for (var a = 0; a < alist.length; a++) {" +
                          "                   var albl = (alist[a].name || alist[a].language || '').toLowerCase();" +
                          "                   if (kw.some(function(k){ return albl.indexOf(k) !== -1; })) { jw.setCurrentAudioTrack(a); break; }" +
                          "               }" +
                          "           }" +
                          "       } catch(e){}" +
                          "   }" +
                          "   var items = document.querySelectorAll('[role=\"menuitemradio\"], [role=\"option\"], .jw-settings-content-item, .vjs-menu-item');" +
                          "   for (var j = 0; j < items.length; j++) {" +
                          "       var it = items[j];" +
                          "       var txt = (it.innerText || it.textContent || '').toLowerCase().trim();" +
                          "       if (txt.length > 1 && txt.length < 30 && kw.some(function(k){ return txt.indexOf(k) !== -1; })) {" +
                          "           if (!it.dataset.cjAutoSelected) {" +
                          "               it.dataset.cjAutoSelected = '1';" +
                          "               try { it.click(); } catch(e){}" +
                          "           }" +
                          "       }" +
                          "   }" +
                          "}" +
                          "if (!window.__cjListenersAttached) {" +
                          "   window.__cjListenersAttached = true;" +
                          "   var mutTimer = null;" +
                          "   var observer = new MutationObserver(function() {" +
                          "       if (mutTimer) clearTimeout(mutTimer);" +
                          "       mutTimer = setTimeout(function() {" +
                          "           refreshFocusableElements();" +
                          "           var p = window.location.pathname.toLowerCase();" +
                          "           if (p.indexOf('/watch') !== -1 || p.indexOf('/play') !== -1 || document.querySelector('video, iframe[src*=\"embed\"], iframe[src*=\"player\"]')) {" +
                          "               if (window.AndroidBridge) window.AndroidBridge.setVideoPlaying(true);" +
                          "               activatePreferredTracks();" +
                          "           }" +
                          "       }, 450);" +
                          "   });" +
                          "   observer.observe(document.body || document.documentElement, {childList: true, subtree: true});" +
                          "   document.addEventListener('focusin', function(e) {" +
                          "       if (e.target && e.target.scrollIntoView) {" +
                          "           try { e.target.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'nearest'}); } catch(err){}" +
                          "       }" +
                          "   }, true);" +
                          "   document.addEventListener('click', function(e) {" +
                          "       var el = e.target.closest('button, a, [role=\"button\"]');" +
                          "       if (el) {" +
                          "           var t = (el.innerText || el.getAttribute('aria-label') || '').toLowerCase();" +
                          "           if (t.indexOf('play') !== -1 || t.indexOf('watch') !== -1 || t.indexOf('izle') !== -1) {" +
                          "               if (window.AndroidBridge) window.AndroidBridge.setVideoPlaying(true);" +
                          "           }" +
                          "       }" +
                          "   }, true);" +
                          "   document.addEventListener('play', function(e) {" +
                          "       if (window.AndroidBridge) window.AndroidBridge.setVideoPlaying(true);" +
                          "       setTimeout(activatePreferredTracks, 600);" +
                          "       setTimeout(activatePreferredTracks, 2200);" +
                          "   }, true);" +
                          "}" +
                          "})()";
                  webView.evaluateJavascript(js, null);
              }

              private void setupWebView() {
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.addJavascriptInterface(new WebAppBridge(), "AndroidBridge");

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  if (isTelevision) {
                      settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36");
                  } else {
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
                  }

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          return !url.contains("cinejoy.pk");
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString().toLowerCase();
                          // Reklam ve Pop-up sunucularını ağ seviyesinde sıfır gecikmeyle kes
                          if (url.contains("doubleclick.net") || url.contains("googlesyndication") ||
                              url.contains("popads") || url.contains("adsterra") || url.contains("propellerads") ||
                              url.contains("onclickads") || url.contains("exoclick") || url.contains("acscdn") ||
                              url.contains("histats") || url.contains("yandex.ru/metrika")) {
                              return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream("".getBytes()));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectSmartEngine();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              loadingBar.setVisibility(View.VISIBLE);
                              loadingBar.setProgress(newProgress);
                          } else {
                              loadingBar.setVisibility(View.GONE);
                              injectSmartEngine();
                          }
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          fullscreenContainer.addView(view);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          fullscreenContainer.setVisibility(View.GONE);
                          fullscreenContainer.removeView(customView);
                          customView = null;
                          customViewCallback.onCustomViewHidden();
                          webView.setVisibility(View.VISIBLE);
                          if (!isTelevision) {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                          }
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  if (event.getAction() == KeyEvent.ACTION_DOWN) {
                      if (keyCode == KeyEvent.KEYCODE_MENU) {
                          showCinematicLanguageModal(false);
                          return true;
                      }
                      // TV Kumandası OK / Enter tuşunun seçili öğeye kesin tıklamasını garanti et
                      if ((keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) && customView == null) {
                          webView.evaluateJavascript(
                              "javascript:(function(){ if(document.activeElement && document.activeElement !== document.body){ document.activeElement.click(); } })()",
                              null
                          );
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (customView != null) {
                          webView.getWebChromeClient().onHideCustomView();
                          return true;
                      }
                      if (!isTelevision) {
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                      }
                      if (webView.canGoBack()) {
                          webView.goBack();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
