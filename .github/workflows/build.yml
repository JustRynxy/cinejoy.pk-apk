name: APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Proje Klasorlerini ve Dosyalari Olustur
        run: |
          mkdir -p app/src/main/java/com/kisisel/cinejoy
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          rootProject.name = "Cinejoy"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.kisisel.cinejoy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.kisisel.cinejoy"
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName "4.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 1. Arka Plan Katmanı
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#111116"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # 2. Ön Plan Katmanı (Cinejoy Klaket Logosu)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,44 L78,44 C80.2,44 82,45.8 82,48 L82,76 C82,78.2 80.2,80 78,80 L30,80 C27.8,80 26,78.2 26,76 L26,48 C26,45.8 27.8,44 30,44 Z"/>
              <path
                  android:fillColor="#E50914"
                  android:pathData="M26,32 L82,32 L82,41 L26,41 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,32 L40,32 L36,41 L30,41 Z M48,32 L54,32 L50,41 L44,41 Z M62,32 L68,32 L64,41 L58,41 Z M74,32 L80,32 L76,41 L70,41 Z"/>
              <path
                  android:fillColor="#111116"
                  android:pathData="M47,52 L47,72 L65,62 Z"/>
          </vector>
          EOF

          # 3. TV Banner ve Eski Cihaz İkonu
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_legacy.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_background"/>
              <item android:drawable="@drawable/ic_launcher_foreground"/>
          </layer-list>
          EOF

          # 4. Adaptive Icon Tanımı
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Cinejoy"
                  android:usesCleartextTraffic="true"
                  android:banner="@drawable/ic_launcher_legacy"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java (Doğrudan Kumanda Odaklanmalı - Fare İmleçsiz)
          cat << 'EOF' > app/src/main/java/com/kisisel/cinejoy/MainActivity.java
          package com.kisisel.cinejoy;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.UiModeManager;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;
              private final String TARGET_URL = "https://cinejoy.pk";
              private SharedPreferences prefs;
              private boolean isTelevision = false;

              private final String[] LANG_NAMES = {
                  "Türkçe (Altyazı & Dublaj)",
                  "English (Subtitles & Audio)",
                  "Deutsch (German)",
                  "Español (Spanish)",
                  "Français (French)",
                  "Русский (Russian)",
                  "العربية (Arabic)"
              };
              private final String[] LANG_CODES = {"tr", "en", "de", "es", "fr", "ru", "ar"};
              private final String[] LANG_KEYWORDS = {
                  "türkçe,turkce,turkish,tr,dublaj,altyazı,altyazi",
                  "english,eng,en",
                  "deutsch,german,deu,ger,de",
                  "español,espanol,spanish,esp,es",
                  "français,francais,french,fre,fr",
                  "русский,russian,rus,ru",
                  "العربية,arabic,ara,ar"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("CinejoyPrefs", MODE_PRIVATE);

                  UiModeManager uiModeManager = (UiModeManager) getSystemService(UI_MODE_SERVICE);
                  isTelevision = (uiModeManager != null && uiModeManager.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION);

                  if (isTelevision) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                  }

                  FrameLayout rootLayout = new FrameLayout(this);
                  webView = new WebView(this);
                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setVisibility(View.GONE);

                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  setContentView(rootLayout);
                  setupWebView();

                  if (!prefs.contains("selected_lang_index")) {
                      showLanguageDialog(true);
                  } else {
                      loadSiteWithLanguage();
                  }
              }

              public class WebAppBridge {
                  @JavascriptInterface
                  public void setVideoPlaying(boolean playing) {
                      runOnUiThread(() -> {
                          if (!isTelevision) {
                              if (playing) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                              } else if (customView == null) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                              }
                          }
                      });
                  }
              }

              private void showLanguageDialog(boolean isFirstLaunch) {
                  int currentIdx = prefs.getInt("selected_lang_index", 0);
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Tercih Edilen Dil / Preferred Language");
                  builder.setSingleChoiceItems(LANG_NAMES, currentIdx, (dialog, which) -> {
                      prefs.edit().putInt("selected_lang_index", which).apply();
                      Toast.makeText(MainActivity.this, "Dil kaydedildi: " + LANG_NAMES[which], Toast.LENGTH_SHORT).show();
                      dialog.dismiss();
                      loadSiteWithLanguage();
                  });
                  builder.setCancelable(!isFirstLaunch);
                  builder.show();
              }

              private void loadSiteWithLanguage() {
                  int idx = prefs.getInt("selected_lang_index", 0);
                  String code = LANG_CODES[idx];
                  Map<String, String> headers = new HashMap<>();
                  headers.put("Accept-Language", code + "-" + code.toUpperCase() + "," + code + ";q=0.9,en-US;q=0.8,en;q=0.7");
                  webView.loadUrl(TARGET_URL, headers);
              }

              private void injectTvDpadAndHooks() {
                  int idx = prefs.getInt("selected_lang_index", 0);
                  String langCode = LANG_CODES[idx];
                  String keywords = LANG_KEYWORDS[idx];

                  // 1. Pop-up'ları gizle
                  // 2. Tüm buton ve film kartlarına TV Kumandası odaklanma çerçevesi (Focus Ring) ekle
                  // 3. Play butonuna basıldığında telefonu otomatik yan çevir
                  String js = "javascript:(function() {" +
                          "if (!document.getElementById('cinejoy_tv_css')) {" +
                          "   var style = document.createElement('style');" +
                          "   style.id = 'cinejoy_tv_css';" +
                          "   style.innerHTML = '" +
                          "       .swal2-container, .fc-consent-root, [class*=\"popup\"], [id*=\"popup\"], .modal-backdrop, [class*=\"ads-\"] { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; } " +
                          "       body { overflow: auto !important; } " +
                          "       *:focus { outline: 3.5px solid #E50914 !important; outline-offset: 3px !important; box-shadow: 0 0 18px rgba(229,9,20,0.85) !important; transition: transform 0.15s ease !important; z-index: 9999 !important; } " +
                          "   ';" +
                          "   (document.head || document.documentElement).appendChild(style);" +
                          "}" +
                          "if (window.cinejoyOptRunning) return;" +
                          "window.cinejoyOptRunning = true;" +
                          "var keywords = '" + keywords + "'.split(',');" +
                          "var langCode = '" + langCode + "';" +
                          "try { localStorage.setItem('language', langCode); localStorage.setItem('pl_lang', langCode); } catch(e){}" +
                          "document.addEventListener('click', function(e) {" +
                          "   var el = e.target.closest('button, a, [role=\"button\"]');" +
                          "   if (el) {" +
                          "       var txt = (el.innerText || el.getAttribute('aria-label') || '').toLowerCase();" +
                          "       if (txt.indexOf('play') !== -1 || txt.indexOf('watch') !== -1 || txt.indexOf('izle') !== -1) {" +
                          "           if (window.AndroidBridge) window.AndroidBridge.setVideoPlaying(true);" +
                          "       }" +
                          "   }" +
                          "}, true);" +
                          "document.addEventListener('play', function(e) {" +
                          "   if (window.AndroidBridge) window.AndroidBridge.setVideoPlaying(true);" +
                          "}, true);" +
                          "document.addEventListener('keydown', function(e) {" +
                          "   if (e.keyCode === 13 || e.key === 'Enter') {" +
                          "       if (document.activeElement && document.activeElement !== document.body) {" +
                          "           document.activeElement.click();" +
                          "       }" +
                          "   }" +
                          "});" +
                          "setInterval(function() {" +
                          "   var closeBtns = document.querySelectorAll('[class*=\"close\"], [id*=\"close\"], [aria-label*=\"Close\"], .swal2-close, .btn-close');" +
                          "   closeBtns.forEach(function(b) { if(b.offsetParent !== null) { try { b.click(); } catch(e){} } });" +
                          "   var interactives = document.querySelectorAll('a, button, input, select, [role=\"button\"], [onclick], [class*=\"card\"], [class*=\"item\"], [class*=\"poster\"], [class*=\"movie\"], [class*=\"btn\"]');" +
                          "   interactives.forEach(function(el) {" +
                          "       if (!el.hasAttribute('tabindex') && el.offsetParent !== null) {" +
                          "           el.setAttribute('tabindex', '0');" +
                          "       }" +
                          "   });" +
                          "   var urlPath = window.location.pathname.toLowerCase();" +
                          "   var hasVideo = document.querySelector('video, iframe[src*=\"embed\"], iframe[src*=\"player\"], iframe[src*=\"vid\"], .jwplayer, .video-js');" +
                          "   if (hasVideo || urlPath.indexOf('/watch') !== -1 || urlPath.indexOf('/play') !== -1) {" +
                          "       if (window.AndroidBridge) window.AndroidBridge.setVideoPlaying(true);" +
                          "   }" +
                          "   var videos = document.querySelectorAll('video');" +
                          "   videos.forEach(function(v) {" +
                          "       if (v.textTracks) {" +
                          "           for (var i = 0; i < v.textTracks.length; i++) {" +
                          "               var t = v.textTracks[i];" +
                          "               var label = (t.label || '').toLowerCase();" +
                          "               var srclang = (t.language || '').toLowerCase();" +
                          "               var match = (srclang === langCode) || keywords.some(function(k){ return label.indexOf(k) !== -1; });" +
                          "               if (match && t.mode !== 'showing') { t.mode = 'showing'; }" +
                          "           }" +
                          "       }" +
                          "   });" +
                          "   var trackItems = document.querySelectorAll('[class*=\"subtitle\"] li, [class*=\"caption\"] li, [class*=\"audio\"] li, [class*=\"lang\"] li, .jw-settings-content-item, .vjs-menu-item');" +
                          "   trackItems.forEach(function(item) {" +
                          "       var txt = (item.innerText || '').toLowerCase();" +
                          "       if (keywords.some(function(k){ return txt.indexOf(k) !== -1; })) {" +
                          "           if (!item.classList.contains('active') && !item.classList.contains('jw-active-option') && !item.classList.contains('vjs-selected') && !item.dataset.autoClicked) {" +
                          "               item.dataset.autoClicked = 'true';" +
                          "               try { item.click(); } catch(e){}" +
                          "           }" +
                          "       }" +
                          "   });" +
                          "}, 1000);" +
                          "})()";
                  webView.evaluateJavascript(js, null);
              }

              private void setupWebView() {
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.addJavascriptInterface(new WebAppBridge(), "AndroidBridge");

                  // Doğrudan TV Kumandası (D-Pad) odaklanmasını aktif et
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  if (isTelevision) {
                      settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36");
                  } else {
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
                  }

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          return !url.contains("cinejoy.pk");
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString().toLowerCase();
                          if (url.contains("doubleclick.net") || url.contains("googlesyndication") ||
                              url.contains("popads") || url.contains("adsterra") || url.contains("propellerads") ||
                              url.contains("onclickads") || url.contains("exoclick") || url.contains("acscdn")) {
                              return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream("".getBytes()));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageCommitVisible(WebView view, String url) {
                          super.onPageCommitVisible(view, url);
                          injectTvDpadAndHooks();
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectTvDpadAndHooks();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          fullscreenContainer.addView(view);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          fullscreenContainer.setVisibility(View.GONE);
                          fullscreenContainer.removeView(customView);
                          customView = null;
                          customViewCallback.onCustomViewHidden();
                          webView.setVisibility(View.VISIBLE);
                          if (!isTelevision) {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                          }
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getAction() == KeyEvent.ACTION_DOWN) {
                      if (event.getKeyCode() == KeyEvent.KEYCODE_MENU) {
                          showLanguageDialog(false);
                          return true;
                      }
                  }
                  // Tüm yön ve OK tuşlarını doğrudan WebView'ın kendi kumanda navigasyonuna ilet
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (customView != null) {
                          webView.getWebChromeClient().onHideCustomView();
                          return true;
                      }
                      if (!isTelevision) {
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                      }
                      if (webView.canGoBack()) {
                          webView.goBack();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: 2. Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 4. APK Derle
        run: gradle assembleDebug

      - name: 5. APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-NativeTV-v4
          path: app/build/outputs/apk/debug/app-debug.apk
