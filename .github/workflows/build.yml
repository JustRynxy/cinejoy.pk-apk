name: APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodlari Hazirla
        run: |
          mkdir -p app/src/main/java/com/kisisel/cinejoy
          mkdir -p app/src/main/res/drawable

          # settings.gradle
          echo 'rootProject.name = "Cinejoy"' > settings.gradle
          echo 'include(":app")' >> settings.gradle

          # build.gradle (Project)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.1.0" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.kisisel.cinejoy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.kisisel.cinejoy"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Cinejoy"
                  android:usesCleartextTraffic="true"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java (Otomatik Pop-up Silici + TV Kumandası Fare İmleci)
          cat << 'EOF' > app/src/main/java/com/kisisel/cinejoy/MainActivity.java
          package com.kisisel.cinejoy;

          import android.app.Activity;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import java.io.ByteArrayInputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;
              private View cursorView;
              private float cursorX = 500;
              private float cursorY = 500;
              private final float CURSOR_STEP = 35f;
              private final String TARGET_URL = "https://cinejoy.pk";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  FrameLayout rootLayout = new FrameLayout(this);
                  webView = new WebView(this);
                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setVisibility(View.GONE);

                  // TV Kumandası için Sanal Fare İmleci (Kırmızı Nokta)
                  cursorView = new View(this) {
                      Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      @Override
                      protected void onDraw(Canvas canvas) {
                          super.onDraw(canvas);
                          paint.setStyle(Paint.Style.FILL);
                          paint.setColor(Color.argb(200, 255, 50, 50));
                          canvas.drawCircle(cursorX, cursorY, 14f, paint);
                          paint.setStyle(Paint.Style.STROKE);
                          paint.setColor(Color.WHITE);
                          paint.setStrokeWidth(3f);
                          canvas.drawCircle(cursorX, cursorY, 14f, paint);
                      }
                  };
                  cursorView.setClickable(false);
                  cursorView.setFocusable(false);

                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(cursorView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  setContentView(rootLayout);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          return !url.contains("cinejoy.pk");
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString().toLowerCase();
                          if (url.contains("doubleclick.net") || url.contains("googlesyndication") ||
                              url.contains("popads") || url.contains("adsterra") || url.contains("propellerads")) {
                              return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream("".getBytes()));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Her 1 saniyede bir çıkan pop-up katmanlarını ve kapatma butonlarını otomatik temizler
                          String js = "javascript:(function() {" +
                                  "setInterval(function() {" +
                                  "   document.dispatchEvent(new KeyboardEvent('keydown', {'key': 'Escape', 'keyCode': 27}));" +
                                  "   var closeBtns = document.querySelectorAll('[class*=\"close\"], [id*=\"close\"], [aria-label*=\"Close\"], [aria-label*=\"Kapat\"], .swal2-close, .btn-close');" +
                                  "   closeBtns.forEach(function(b) { try { b.click(); } catch(e){} });" +
                                  "   var modals = document.querySelectorAll('[class*=\"popup\"], [id*=\"popup\"], [class*=\"modal\"], [id*=\"modal\"], .swal2-container, .fc-consent-root');" +
                                  "   modals.forEach(function(m) { m.remove(); });" +
                                  "   document.body.style.overflow = 'auto';" +
                                  "}, 1000);" +
                                  "})()";
                          view.evaluateJavascript(js, null);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          cursorView.setVisibility(View.GONE);
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          fullscreenContainer.addView(view);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          fullscreenContainer.setVisibility(View.GONE);
                          fullscreenContainer.removeView(customView);
                          customView = null;
                          customViewCallback.onCustomViewHidden();
                          webView.setVisibility(View.VISIBLE);
                          cursorView.setVisibility(View.VISIBLE);
                      }
                  });

                  webView.loadUrl(TARGET_URL);
              }

              private void simulateClick(float x, float y) {
                  long downTime = SystemClock.uptimeMillis();
                  long eventTime = SystemClock.uptimeMillis() + 50;
                  MotionEvent downEvent = MotionEvent.obtain(downTime, downTime, MotionEvent.ACTION_DOWN, x, y, 0);
                  MotionEvent upEvent = MotionEvent.obtain(downTime, eventTime, MotionEvent.ACTION_UP, x, y, 0);
                  webView.dispatchTouchEvent(downEvent);
                  webView.dispatchTouchEvent(upEvent);
                  downEvent.recycle();
                  upEvent.recycle();
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (customView == null && event.getAction() == KeyEvent.ACTION_DOWN) {
                      int keyCode = event.getKeyCode();
                      if (keyCode == KeyEvent.KEYCODE_DPAD_UP) {
                          cursorY = Math.max(0, cursorY - CURSOR_STEP);
                          if (cursorY < 100) webView.scrollBy(0, -120);
                          cursorView.invalidate();
                          return true;
                      } else if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) {
                          cursorY = Math.min(webView.getHeight(), cursorY + CURSOR_STEP);
                          if (cursorY > webView.getHeight() - 100) webView.scrollBy(0, 120);
                          cursorView.invalidate();
                          return true;
                      } else if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT) {
                          cursorX = Math.max(0, cursorX - CURSOR_STEP);
                          cursorView.invalidate();
                          return true;
                      } else if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                          cursorX = Math.min(webView.getWidth(), cursorX + CURSOR_STEP);
                          cursorView.invalidate();
                          return true;
                      } else if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) {
                          simulateClick(cursorX, cursorY);
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (customView != null) {
                          webView.getWebChromeClient().onHideCustomView();
                          return true;
                      }
                      if (webView.canGoBack()) {
                          webView.goBack();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-TV-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
