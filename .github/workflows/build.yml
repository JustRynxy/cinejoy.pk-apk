name: Cinejoy Ultra APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Projeyi ve Birebir Yesil Klaket Logosunu Olustur
        run: |
          rm -rf app build settings.gradle build.gradle settings.gradle.kts build.gradle.kts
          mkdir -p app/src/main/java/tr/cinejoy/original
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          python3 -m pip install --break-system-packages Pillow || python3 -m pip install Pillow
          cat << 'EOF' > make_exact_logo.py
          from PIL import Image, ImageDraw

          def draw_exact_cinejoy_mascot(target_size, with_dark_bg=True):
              # Pürüzsüz (Anti-aliased) çizim için 4x büyük tuvalde çizip küçültüyoruz
              S = 800
              bg_color = (14, 16, 15, 255) if with_dark_bg else (0, 0, 0, 0)
              img = Image.new('RGBA', (S, S), bg_color)
              d = ImageDraw.Draw(img)

              black = (15, 15, 15, 255)
              white = (255, 255, 255, 255)
              neon_green = (146, 255, 78, 255) # #92FF4E birebir görseldeki yeşil

              # 1. Yeşil Alt Gövde (Yuvarlatılmış Dikdörtgen + Kalın Siyah Kontur)
              bx1, by1, bx2, by2 = 85, 290, 715, 735
              d.rounded_rectangle([bx1, by1, bx2, by2], radius=105, fill=neon_green, outline=black, width=44)

              # Gövde içindeki hafif açık yeşil üst parlama katmanı (görseldeki gibi)
              d.rounded_rectangle([bx1+24, by1+24, bx2-24, by2-48], radius=80, fill=(154, 255, 92, 255))

              # 2. Üst Sol Klaket Parçası (Yuvarlatılmış Üçgenimsi Kutu)
              p1 = [(105, 145), (275, 105), (200, 295), (125, 295)]
              d.polygon(p1, fill=white)
              d.line(p1 + [p1[0]], fill=black, width=42, joint="curve")

              # 3. Üst Orta Klaket Parçası (Eğik Paralelkenar)
              p2 = [(395, 55), (535, 35), (415, 295), (265, 295)]
              d.polygon(p2, fill=white)
              d.line(p2 + [p2[0]], fill=black, width=42, joint="curve")

              # 4. Üst Sağ Klaket Parçası
              p3 = [(645, 75), (725, 235), (695, 285), (535, 285)]
              d.polygon(p3, fill=white)
              d.line(p3 + [p3[0]], fill=black, width=42, joint="curve")

              # 5. Sol Göz (Siyah Daire)
              ex, ey, er = 265, 495, 64
              d.ellipse([ex-er, ey-er, ex+er, ey+er], fill=black)

              # 6. Sağ Göz Kırpma (< Şeklinde Kalın Siyah Çizgi)
              wink = [(525, 315), (445, 455), (575, 435)]
              d.line(wink, fill=black, width=44, joint="curve")
              # Çizgi uçlarını yuvarlat
              for wx, wy in wink:
                  d.ellipse([wx-21, wy-21, wx+21, wy+21], fill=black)

              # 7. Gülümseyen Ağız (Kalın Siyah Yay)
              mouth_box = [245, 430, 625, 695]
              d.arc(mouth_box, start=12, end=142, fill=black, width=44)
              # Ağız uçlarını yuvarlat
              d.ellipse([272-20, 645-20, 272+20, 645+20], fill=black)
              d.ellipse([612-20, 585-20, 612+20, 585+20], fill=black)

              return img.resize((target_size, target_size), Image.Resampling.LANCZOS)

          for folder, sz in [('mipmap-mdpi',48), ('mipmap-hdpi',72), ('mipmap-xhdpi',96), ('mipmap-xxhdpi',144), ('mipmap-xxxhdpi',192)]:
              ic = draw_exact_cinejoy_mascot(sz, with_dark_bg=True)
              ic.save(f'app/src/main/res/{folder}/ic_launcher.png', 'PNG')
              ic.save(f'app/src/main/res/{folder}/ic_launcher_round.png', 'PNG')

          # Adaptive Icon Foreground (432x432)
          fg = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          mascot = draw_exact_cinejoy_mascot(276, with_dark_bg=False)
          fg.paste(mascot, (78, 78), mascot)
          fg.save('app/src/main/res/drawable/ic_launcher_fg.png', 'PNG')

          # Android TV Ana Ekran Banner'ı (320x180)
          banner = Image.new('RGBA', (320, 180), (14, 16, 15, 255))
          bd = ImageDraw.Draw(banner)
          bd.rounded_rectangle([4, 4, 316, 176], radius=18, outline=(146, 255, 78, 255), width=4)
          b_mascot = draw_exact_cinejoy_mascot(124, with_dark_bg=False)
          banner.paste(b_mascot, (24, 28), b_mascot)
          bd.rounded_rectangle([162, 62, 288, 86], radius=6, fill=(255, 255, 255, 255))
          bd.rounded_rectangle([162, 98, 252, 116], radius=5, fill=(146, 255, 78, 255))
          banner.save('app/src/main/res/drawable/tv_banner.png', 'PNG')
          EOF
          python3 make_exact_logo.py

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0E100F" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "Cinejoy"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'tr.cinejoy.original'
              compileSdk 34
              defaultConfig {
                  applicationId "tr.cinejoy.original"
                  minSdk 21
                  targetSdk 34
                  versionCode 400
                  versionName "40.0-FINAL"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:label="Cinejoy"
                  android:usesCleartextTraffic="true"
                  android:banner="@drawable/tv_banner"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/tr/cinejoy/original/MainActivity.java
          package tr.cinejoy.original;

          import android.app.Activity;
          import android.app.Dialog;
          import android.app.UiModeManager;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;
              private ProgressBar loadingBar;
              private final String TARGET_URL = "https://cinejoy.pk";
              private SharedPreferences prefs;
              private boolean isTvDevice = false;

              private final String[] LANG_NAMES = {
                  "🇹🇷   Türkçe  (Altyazı & Dublaj)",
                  "🇬🇧   English  (Original & Subtitles)",
                  "🇩🇪   Deutsch  (German)",
                  "🇪🇸   Español  (Spanish)",
                  "🇫🇷   Français  (French)"
              };
              private final String[] LANG_CODES = {"tr", "en", "de", "es", "fr"};
              private final String[] LANG_LABELS = {"Turkish", "English", "German", "Spanish", "French"};

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("CinejoyOrigPrefs", MODE_PRIVATE);

                  UiModeManager uiModeManager = (UiModeManager) getSystemService(UI_MODE_SERVICE);
                  PackageManager pm = getPackageManager();
                  boolean hasLeanback = pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK);
                  boolean noTouch = !pm.hasSystemFeature(PackageManager.FEATURE_TOUCHSCREEN);
                  boolean uiTv = (uiModeManager != null && uiModeManager.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION);
                  isTvDevice = uiTv || hasLeanback || noTouch;

                  if (isTvDevice) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                  }

                  FrameLayout rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#0A0C0A"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0A0C0A"));

                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  fullscreenContainer.setVisibility(View.GONE);

                  loadingBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  loadingBar.setMax(100);
                  loadingBar.setProgressDrawable(new ColorDrawable(Color.parseColor("#92FF4E")));
                  FrameLayout.LayoutParams barLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 5);
                  barLp.gravity = Gravity.TOP;

                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  rootLayout.addView(loadingBar, barLp);

                  setContentView(rootLayout);
                  setupWebView();

                  loadSiteWithLanguage();
                  if (!prefs.contains("selected_lang_index")) {
                      showLanguageModal(true);
                  }
              }

              public class WebAppBridge {
                  @JavascriptInterface
                  public void onVideoState(boolean playing) {
                      runOnUiThread(() -> {
                          if (!isTvDevice) {
                              if (playing) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                              } else if (customView == null) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                              }
                          }
                      });
                  }
              }

              private void showLanguageModal(boolean isFirstLaunch) {
                  Dialog dialog = new Dialog(this);
                  dialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  dialog.setCancelable(!isFirstLaunch);
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      dialog.getWindow().setDimAmount(0.85f);
                  }

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(60, 48, 60, 48);
                  GradientDrawable cardBg = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.parseColor("#141C14"), Color.parseColor("#0B0F0B")});
                  cardBg.setCornerRadius(36f);
                  cardBg.setStroke(3, Color.parseColor("#92FF4E"));
                  card.setBackground(cardBg);

                  TextView title = new TextView(this);
                  title.setText("CINEJOY - DİL SEÇİMİ");
                  title.setTextColor(Color.parseColor("#92FF4E"));
                  title.setTextSize(20f);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 28);
                  card.addView(title);

                  int currentIdx = prefs.getInt("selected_lang_index", 0);

                  for (int i = 0; i < LANG_NAMES.length; i++) {
                      final int index = i;
                      Button btn = new Button(this);
                      btn.setText(LANG_NAMES[i]);
                      btn.setTextColor(Color.WHITE);
                      btn.setTextSize(15f);
                      btn.setAllCaps(false);
                      btn.setGravity(Gravity.CENTER_VERTICAL | Gravity.START);
                      btn.setPadding(44, 24, 44, 24);

                      GradientDrawable normalBg = new GradientDrawable();
                      normalBg.setColor(i == currentIdx ? Color.parseColor("#203020") : Color.parseColor("#141D14"));
                      normalBg.setCornerRadius(18f);
                      normalBg.setStroke(2, i == currentIdx ? Color.parseColor("#92FF4E") : Color.parseColor("#243424"));

                      GradientDrawable focusedBg = new GradientDrawable();
                      focusedBg.setColor(Color.parseColor("#92FF4E"));
                      focusedBg.setCornerRadius(18f);
                      focusedBg.setStroke(3, Color.BLACK);

                      StateListDrawable states = new StateListDrawable();
                      states.addState(new int[]{android.R.attr.state_focused}, focusedBg);
                      states.addState(new int[]{android.R.attr.state_pressed}, focusedBg);
                      states.addState(new int[]{}, normalBg);
                      btn.setBackground(states);

                      btn.setOnFocusChangeListener((v, hasFocus) -> {
                          btn.setTextColor(hasFocus ? Color.BLACK : Color.WHITE);
                          btn.setTypeface(null, hasFocus ? Typeface.BOLD : Typeface.NORMAL);
                      });

                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              isTvDevice ? 680 : ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, 8, 0, 8);
                      btn.setLayoutParams(lp);

                      btn.setOnClickListener(v -> {
                          prefs.edit().putInt("selected_lang_index", index).apply();
                          Toast.makeText(MainActivity.this, LANG_NAMES[index] + " seçildi", Toast.LENGTH_SHORT).show();
                          dialog.dismiss();
                          injectLightweightEngine();
                      });

                      card.addView(btn);
                      if (i == currentIdx) {
                          btn.post(btn::requestFocus);
                      }
                  }

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(card);
                  dialog.setContentView(scroll);
                  dialog.show();
              }

              private void loadSiteWithLanguage() {
                  int idx = prefs.getInt("selected_lang_index", 0);
                  String code = LANG_CODES[idx];
                  Map<String, String> headers = new HashMap<>();
                  headers.put("Accept-Language", code + "-" + code.toUpperCase() + "," + code + ";q=0.9,en-US;q=0.8,en;q=0.7");
                  webView.loadUrl(TARGET_URL, headers);
              }

              // Donma Yapmayan, Altyazı Menüsünü Serbest Kaydıran ve Iframe Dili Enjekte Eden Hafif Motor
              private void injectLightweightEngine() {
                  int idx = prefs.getInt("selected_lang_index", 0);
                  String langCode = LANG_CODES[idx];
                  String langLabel = LANG_LABELS[idx];

                  String js = "javascript:(function() {" +
                          "var langCode = '" + langCode + "';" +
                          "var langLabel = '" + langLabel + "';" +
                          "try {" +
                          "   localStorage.setItem('language', langCode);" +
                          "   localStorage.setItem('lang', langCode);" +
                          "   localStorage.setItem('pl_lang', langCode);" +
                          "   localStorage.setItem('subtitle_language', langLabel);" +
                          "   localStorage.setItem('captions_language', langLabel);" +
                          "   localStorage.setItem('jwplayer.captionLabel', langLabel);" +
                          "} catch(e){}" +
                          "if (!document.getElementById('cinejoy_final_css')) {" +
                          "   var style = document.createElement('style');" +
                          "   style.id = 'cinejoy_final_css';" +
                          "   style.innerHTML = '" +
                          "       *, *::before, *::after { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; filter: none !important; box-shadow: none !important; text-shadow: none !important; transition: none !important; animation: none !important; } " +
                          "       *:focus { outline: 3.5px solid #92FF4E !important; outline-offset: 2px !important; border-radius: 6px !important; } " +
                          "   ';" +
                          "   (document.head || document.documentElement).appendChild(style);" +
                          "}" +
                          "/* Sayfadaki kartları ve altyazı seçeneklerini doğal kumanda odaklanmasına aç */" +
                          "var els = document.querySelectorAll('a, button, [role=\"button\"], [role=\"menuitem\"], [role=\"menuitemradio\"], [role=\"option\"], [onclick]');" +
                          "for (var i = 0; i < els.length; i++) {" +
                          "   if (!els[i].hasAttribute('tabindex')) els[i].setAttribute('tabindex', '0');" +
                          "}" +
                          "/* Gömülü video oynatıcıya (iframe) seçilen dili otomatik ekle */" +
                          "var iframes = document.querySelectorAll('iframe');" +
                          "for (var j = 0; j < iframes.length; j++) {" +
                          "   var src = iframes[j].src || '';" +
                          "   if (src.length > 10 && src.indexOf('cinejoy.pk') === -1 && src.indexOf('ds_lang=') === -1) {" +
                          "       var sep = src.indexOf('?') === -1 ? '?' : '&';" +
                          "       iframes[j].src = src + sep + 'ds_lang=' + langCode + '&sub=' + langCode + '&lang=' + langCode + '&caption=' + langLabel;" +
                          "   }" +
                          "}" +
                          "if (!window.__finalBound) {" +
                          "   window.__finalBound = true;" +
                          "   document.addEventListener('click', function(e) {" +
                          "       var el = e.target.closest('button, a, [role=\"button\"]');" +
                          "       if (el) {" +
                          "           var txt = (el.innerText || el.getAttribute('aria-label') || '').toLowerCase();" +
                          "           if (txt.indexOf('play') !== -1 || txt.indexOf('watch') !== -1) {" +
                          "               if (window.AndroidBridge) window.AndroidBridge.onVideoState(true);" +
                          "           }" +
                          "       }" +
                          "   }, true);" +
                          "   document.addEventListener('play', function() {" +
                          "       if (window.AndroidBridge) window.AndroidBridge.onVideoState(true);" +
                          "   }, true);" +
                          "}" +
                          "})()";
                  webView.evaluateJavascript(js, null);
              }

              private void setupWebView() {
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.addJavascriptInterface(new WebAppBridge(), "AndroidBridge");

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setRenderPriority(WebSettings.RenderPriority.HIGH);

                  settings.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          return !url.contains("cinejoy.pk");
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString().toLowerCase();
                          if (url.contains("doubleclick.net") || url.contains("googlesyndication") ||
                              url.contains("popads") || url.contains("adsterra") || url.contains("propellerads") ||
                              url.contains("onclickads") || url.contains("exoclick") || url.contains("acscdn") ||
                              url.contains("google-analytics") || url.contains("googletagmanager") || url.contains("clarity.ms")) {
                              return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream("".getBytes()));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectLightweightEngine();
                          if (url.contains("/watch") || url.contains("/play")) {
                              if (!isTvDevice) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                              }
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              loadingBar.setVisibility(View.VISIBLE);
                              loadingBar.setProgress(newProgress);
                          } else {
                              loadingBar.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          fullscreenContainer.addView(view);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          fullscreenContainer.setVisibility(View.GONE);
                          fullscreenContainer.removeView(customView);
                          customView = null;
                          customViewCallback.onCustomViewHidden();
                          webView.setVisibility(View.VISIBLE);
                          if (!isTvDevice) {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                          }
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  if (event.getAction() == KeyEvent.ACTION_DOWN && keyCode == KeyEvent.KEYCODE_MENU) {
                      showLanguageModal(false);
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (customView != null) {
                          webView.getWebChromeClient().onHideCustomView();
                          return true;
                      }
                      if (!isTvDevice) {
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER);
                      }
                      if (webView.canGoBack()) {
                          webView.goBack();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
